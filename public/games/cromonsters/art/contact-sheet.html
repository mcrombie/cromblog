<!doctype html>

        <meta name="viewport" content="width=device-width,initial-scale=1" /><title>

        <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
        <style>
          @font-face {
            font-family: Estate;
            src: url('../fonts/estate-ledger.ttf');
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            padding: 24px;
            background: #302835;
            color: #faf0c2;
            font:
              16px Estate,
              monospace;
          }
          h1,
          h2 {
            color: #e2be79;
          }
          p {
            max-width: 70ch;
            line-height: 1.6;
          }
          .preview {
            width: 640px;
            max-width: 100%;
            image-rendering: pixelated;
          }
          .palette,
          .frames {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
          }
          .swatch {
            width: 32px;
            height: 32px;
            border: 1px solid #8c8370;
          }
          figure {
            margin: 0;
            padding: 12px;
            background: #504047;
            min-width: 140px;
            max-width: 230px;
            overflow-wrap: anywhere;
          }
          .frame {
            background-repeat: no-repeat;
            image-rendering: pixelated;
            margin: 0 auto 12px;
          }
          figcaption {
            font: 12px monospace;
            max-width: 190px;
            line-height: 1.6;
          }
          a {
            color: #f2dc9a;
          }
        </style>
