      <stop offset="0.55" stop-color="#cda15d" stop-opacity="0.06" />
      <stop offset="1" stop-color="#cda15d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.54" r="0.7">
      <stop offset="0.52" stop-color="#07110e" stop-opacity="0" />
      <stop offset="1" stop-color="#07110e" stop-opacity="0.68" />
